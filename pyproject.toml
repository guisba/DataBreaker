[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "databreaker"
version = "0.1.2"
description = "Local-first metadata analyzer, cleaner, normalizer, and provenance inspector."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "mutagen>=1.47,<2",
]

[project.scripts]
databreaker = "databreaker.__main__:main"

[tool.setuptools.package-data]
databreaker = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "databreaker.app:app"
