name: Deploy browser app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "databreaker/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static browser edition
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/python
          cp databreaker/static/index.html _site/index.html
          cp databreaker/static/styles.css _site/styles.css
          cp databreaker/static/app.js _site/app.js
          cp databreaker/static/worker.js _site/worker.js
          cp -R databreaker/static/i18n _site/i18n
          cp -R databreaker _site/python/databreaker
          rm -rf _site/python/databreaker/static
          rm -f _site/python/databreaker/app.py _site/python/databreaker/__main__.py
          sed -i 's|/static/styles.css|./styles.css|g; s|/static/app.js|./app.js|g' _site/index.html
          touch _site/.nojekyll
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
