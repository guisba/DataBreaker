name: Release current version

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "databreaker/**"
      - "requirements*.txt"
      - "README.md"
      - "docs/**"
      - "PRIVACY.md"
      - "SECURITY.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve package version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Check whether release already exists
        id: release
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh public link in existing release
        if: steps.release.outputs.exists == 'true'
        shell: bash
        run: |
          BODY="$(gh release view "$TAG" --json body --jq '.body')"
          if printf '%s' "$BODY" | grep -q 'guisba.github.io/DataBreaker'; then
            printf '%s' "$BODY" | sed 's#https://guisba.github.io/DataBreaker/#https://databreaker-pcdnak.v2.appdeploy.ai/#g' > /tmp/release-notes.md
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          fi
      - name: Build release artifacts
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          mkdir -p dist
          python -m pip wheel . --no-deps -w dist
          git archive --format=tar.gz -o "dist/DataBreaker-${TAG}-source.tar.gz" HEAD
          sha256sum dist/* | tee dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "DataBreaker $TAG" \
            --generate-notes \
            --notes "Public browser edition: https://databreaker-pcdnak.v2.appdeploy.ai/\n\nDocumentation: https://caveras-personal-organization.gitbook.io/databreaker/"
