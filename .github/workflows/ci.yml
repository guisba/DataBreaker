name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: python -m compileall databreaker
      - run: python -m pytest -q
      - run: node --check databreaker/static/app.js
      - run: node --check databreaker/static/worker.js
      - run: python scripts/build_web.py --output web-dist --vendor-pyodide --vendor-exiftool
      - run: test -f web-dist/index.html && test -f web-dist/worker.js && test -f web-dist/exiftool-runtime.js && test -n "$(find web-dist/exiftool -name '*.wasm' -print -quit)" && test -f web-dist/python/databreaker/engine.py && test -f web-dist/pyodide/pyodide.asm.wasm && test -f web-dist/pyodide/python_stdlib.zip
      - run: python -m pip wheel . --no-deps -w dist


  browser-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser dependencies
        run: |
          python -m pip install playwright
          npm install --no-audit --no-fund --ignore-scripts
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build browser-only site
        run: python scripts/build_web.py --output web-dist --vendor-pyodide --vendor-exiftool
      - name: Start static server
        run: |
          python -m http.server 8765 --directory web-dist > /tmp/databreaker-http.log 2>&1 &
          echo $! > /tmp/databreaker-http.pid
      - name: Smoke test full metadata inventory, C2PA, and image cleaning
        env:
          DATABREAKER_E2E_URL: http://127.0.0.1:8765/
        run: python tests/browser_smoke.py
      - name: Show static-server log on failure
        if: failure()
        run: cat /tmp/databreaker-http.log || true
