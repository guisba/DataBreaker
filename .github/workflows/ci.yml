name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall databreaker
      - run: python -m pytest -q
      - run: node --check databreaker/static/app.js
      - run: node --check databreaker/static/worker.js
      - run: python scripts/build_web.py --output web-dist
      - run: test -f web-dist/index.html && test -f web-dist/worker.js && test -f web-dist/python/databreaker/engine.py
      - run: python -m pip wheel . --no-deps -w dist
